# Approved learning cluster: two t3.small workers in Mumbai, without a NAT gateway.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
autoModeConfig:
  enabled: false
iam:
  withOIDC: true
metadata:
  name: three-tier-k8s-eks-cluster
  region: ap-south-1
  version: "1.36"
vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
managedNodeGroups:
  - name: learning-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: false
    volumeSize: 20
    volumeType: gp3
    ssh:
      allow: false
